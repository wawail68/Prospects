<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14202e">
<title>Prospects autour de moi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Concept : outil de terrain pour la route. Gros boutons, forts contrastes, distance en gros. */
:root{
  --bg:#eef1f5; --card:#ffffff; --ink:#14202e; --muted:#5a6878; --line:#d5dbe3;
  --accent:#1b5fd1; --accent-ink:#ffffff; --ok:#17794a; --warn:#a15c00; --no:#6b7480; --alert:#c2410c;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1620; --card:#17222f; --ink:#eaf0f7; --muted:#9aa8b8; --line:#2a3849;
  --accent:#7aa8ff; --accent-ink:#0e1620; --ok:#5fd194; --warn:#f0b24a; --no:#8d98a6; --alert:#ff9a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1620; --card:#17222f; --ink:#eaf0f7; --muted:#9aa8b8; --line:#2a3849;
  --accent:#7aa8ff; --accent-ink:#0e1620; --ok:#5fd194; --warn:#f0b24a; --no:#8d98a6; --alert:#ff9a5c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding-block:0 max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
.wrap{max-width:720px;margin:0 auto}
header{padding:max(14px,env(safe-area-inset-top,0px)) 0 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:700 22px/1.1 var(--display);letter-spacing:.01em;margin:0}
.status{font-size:13px;color:var(--muted);min-height:1.4em}
.status.err{color:var(--alert);font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
button.big{width:100%;min-height:56px;font-size:18px;font-family:var(--display);letter-spacing:.02em}
.row{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;min-height:44px}
.naf{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.naf label{display:flex;gap:10px;align-items:center;min-height:38px;font-size:15px}
.naf input{width:20px;height:20px;accent-color:var(--accent)}
.naf code{font:600 13px var(--display);color:var(--muted)}
.tabs{display:flex;gap:6px;margin:12px 0 8px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;font-weight:600;padding:10px 6px;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-variant-numeric:tabular-nums;opacity:.75;font-weight:500}
.alert{background:var(--alert);color:#fff;border-radius:12px;padding:14px;margin:10px 0;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:center}
.alert span{min-width:0;overflow-wrap:anywhere}
.alert button{background:#fff;color:#7a2a07;border-color:transparent}
.cards{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.dist{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.dist small{font-size:15px;font-weight:600;color:var(--muted);margin-left:2px}
.card.near{border-color:var(--alert);box-shadow:inset 4px 0 0 var(--alert)}
.name{font-weight:700;min-width:0;overflow-wrap:anywhere}
.meta{grid-column:2;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.meta b{color:var(--ink);font-weight:600}
.acts{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.acts .go{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;border-radius:10px;min-height:44px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
#map{height:46vh;min-height:280px;border-radius:12px;border:1px solid var(--line);margin:10px 0}
.pill{display:inline-block;font:600 12px var(--display);letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid currentColor}
.pill.known{color:var(--ok)} .pill.no{color:var(--no)} .pill.visit{color:var(--warn)}
footer{color:var(--muted);font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Prospects autour de moi</h1>
    <div class="status" id="status" role="status" aria-live="polite">Appuie sur Démarrer pour te localiser.</div>
  </div>
  <button id="btnSettings" aria-expanded="false" aria-controls="settings">Réglages</button>
</header>

<section id="settings" class="panel" hidden>
  <div class="settings">
    <label class="f">Rayon de recherche
      <select id="selRadius"><option value="1">1 km</option><option value="2">2 km</option><option value="5" selected>5 km</option><option value="10">10 km</option><option value="20">20 km</option></select>
    </label>
    <label class="f">Alerte à moins de
      <select id="selAlert"><option value="200">200 m</option><option value="500" selected>500 m</option><option value="1000">1 km</option><option value="2000">2 km</option></select>
    </label>
    <label class="f">Voix
      <select id="selVoice"><option value="1" selected>Annonce vocale</option><option value="0">Silencieux</option></select>
    </label>
  </div>
  <div class="naf" id="nafBox"></div>
  <div class="row" style="margin-top:12px">
    <button id="btnExport">Exporter ma base</button>
    <button id="btnImport">Importer</button>
    <button id="btnTest">Tester à Colmar</button>
    <input type="file" id="fileImport" accept="application/json" hidden>
  </div>
</section>

<button class="primary big" id="btnStart">Démarrer</button>

<div id="alertBox"></div>

<nav class="tabs" role="tablist" aria-label="Listes">
  <button role="tab" id="tabNear" aria-selected="true">Proches <span class="count" id="cNear">0</span></button>
  <button role="tab" id="tabVisit" aria-selected="false">À visiter <span class="count" id="cVisit">0</span></button>
  <button role="tab" id="tabSeen" aria-selected="false">Déjà vus <span class="count" id="cSeen">0</span></button>
  <button role="tab" id="tabMap" aria-selected="false">Carte</button>
</nav>

<div id="mapWrap" hidden><div id="map"></div></div>
<ul class="cards" id="list"></ul>

<footer>Source : Recherche d'entreprises (data.gouv.fr), données publiques. Ta base « déjà vus » reste sur ce téléphone.</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
"use strict";
var API="https://recherche-entreprises.api.gouv.fr/near_point";
var NAFS=[
 ["43.33Z","Carrelage et revêtement de sols et murs",true],
 ["43.34Z","Peinture et vitrerie",false],
 ["43.31Z","Plâtrerie",false],
 ["43.32A","Menuiserie bois et PVC",false],
 ["43.22A","Plomberie, chauffage",false],
 ["43.21A","Électricité",false],
 ["43.91B","Couverture",false],
 ["43.99C","Maçonnerie générale et gros œuvre",false],
 ["43.39Z","Autres finitions",false]
];
var KEY_DB="prospects.db.v1", KEY_SET="prospects.settings.v1";
var $=function(id){return document.getElementById(id)};

function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

var db=load(KEY_DB,{});                 // siret -> {s:"known"|"no"|"visit", n, c, t}
var settings=load(KEY_SET,{radius:5,alert:500,voice:1,naf:["43.33Z"]});
var pos=null, lastFetch=null, watchId=null, wake=null, testMode=false;
var cache={};                           // siret -> prospect
var alerted={};
var tab="near", fetching=false, audioCtx=null, map=null, layer=null, meMarker=null;

/* ---------- outils ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function dist(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
  var h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);
  return 2*R*Math.asin(Math.sqrt(h))}
function fmt(m){return m<1000?[String(Math.round(m/10)*10||10),"m"]:[(m/1000).toFixed(1).replace(".",","),"km"]}
function say(t,err){var s=$("status");s.textContent=t;s.className="status"+(err?" err":"")}

/* ---------- réglages ---------- */
function drawSettings(){
  $("selRadius").value=String(settings.radius);
  $("selAlert").value=String(settings.alert);
  $("selVoice").value=String(settings.voice);
  $("nafBox").innerHTML=NAFS.map(function(n){
    var on=settings.naf.indexOf(n[0])>-1;
    return '<label><input type="checkbox" data-naf="'+n[0]+'"'+(on?" checked":"")+'> <span>'+esc(n[1])+' <code>'+n[0]+'</code></span></label>';
  }).join("");
}
function readSettings(){
  settings.radius=+$("selRadius").value; settings.alert=+$("selAlert").value; settings.voice=+$("selVoice").value;
  var boxes=document.querySelectorAll("[data-naf]"), l=[];
  for(var i=0;i<boxes.length;i++) if(boxes[i].checked) l.push(boxes[i].getAttribute("data-naf"));
  settings.naf=l.length?l:["43.33Z"];
  save(KEY_SET,settings);
}

/* ---------- données publiques ---------- */
function toProspects(results){
  var out=[];
  results.forEach(function(r){
    var ets=(r.matching_etablissements&&r.matching_etablissements.length)?r.matching_etablissements:[r.siege];
    ets.forEach(function(e){
      if(!e||!e.siret) return;
      if(e.etat_administratif&&e.etat_administratif!=="A") return;
      var lat=parseFloat(e.latitude), lon=parseFloat(e.longitude);
      if(!isFinite(lat)||!isFinite(lon)) return;
      var nom=r.nom_complet||"Entreprise sans nom";
      if(r.statut_diffusion&&r.statut_diffusion!=="O") nom="Entreprise non diffusible";
      out.push({id:e.siret,name:nom,com:e.nom_commercial||"",adr:e.adresse||"",ville:e.libelle_commune||e.commune||"",
        naf:e.activite_principale||r.activite_principale||"",eff:r.tranche_effectif_salarie,
        creat:e.date_debut_activite||r.date_creation||"",lat:lat,lon:lon});
    });
  });
  return out;
}
async function fetchAround(){
  if(!pos||fetching) return;
  fetching=true; say("Recherche des prospects…");
  try{
    var found=[], page=1, pages=1;
    while(page<=pages&&page<=6){
      var u=API+"?lat="+pos.lat.toFixed(5)+"&long="+pos.lon.toFixed(5)+"&radius="+settings.radius+
        "&activite_principale="+encodeURIComponent(settings.naf.join(","))+"&etat_administratif=A&per_page=25&page="+page;
      var res=await fetch(u);
      if(!res.ok) throw new Error("HTTP "+res.status);
      var j=await res.json();
      pages=j.total_pages||1;
      found=found.concat(toProspects(j.results||[]));
      page++;
    }
    found.forEach(function(p){cache[p.id]=p});
    lastFetch={lat:pos.lat,lon:pos.lon};
    say((testMode?"Position test : Colmar · ":"")+found.length+" entreprise(s) trouvée(s) dans "+settings.radius+" km.");
  }catch(e){
    say("Impossible de joindre la base publique ("+e.message+"). Nouvel essai au prochain déplacement.",true);
  }
  fetching=false; render(); checkAlerts();
}

/* ---------- liste ---------- */
function visible(){
  var arr=[];
  for(var id in cache){
    var p=cache[id]; if(!pos) continue;
    var d=dist(pos.lat,pos.lon,p.lat,p.lon);
    if(d>settings.radius*1000) continue;
    arr.push({p:p,d:d,st:db[id]?db[id].s:null});
  }
  arr.sort(function(a,b){return a.d-b.d});
  return arr;
}
function cardHtml(x){
  var p=x.p, f=fmt(x.d), near=!x.st&&x.d<=settings.alert;
  var nav="https://www.google.com/maps/dir/?api=1&destination="+p.lat+","+p.lon;
  var acts;
  if(!x.st) acts='<button class="primary" data-a="known" data-id="'+p.id+'">Je connais</button><button data-a="visit" data-id="'+p.id+'">À visiter</button><button data-a="no" data-id="'+p.id+'">Pas intéressant</button>';
  else if(x.st==="visit") acts='<button class="primary" data-a="known" data-id="'+p.id+'">Visité, je connais</button><button data-a="reset" data-id="'+p.id+'">Remettre dans la liste</button>';
  else acts='<button data-a="reset" data-id="'+p.id+'">Remettre dans la liste</button>';
  var pill=x.st?'<span class="pill '+x.st+'">'+({known:"Connu",no:"Écarté",visit:"À visiter"})[x.st]+'</span> ':"";
  return '<li class="card'+(near?" near":"")+'"><div class="dist">'+f[0]+'<small>'+f[1]+'</small></div>'+
    '<div class="name">'+pill+esc(p.name)+'</div>'+
    '<div class="meta"><b>'+esc(p.ville)+'</b> · '+esc(p.adr)+'<br>Activité '+esc(p.naf)+(p.creat?" · depuis "+esc(String(p.creat).slice(0,4)):"")+'</div>'+
    '<div class="acts"><a class="go" href="'+nav+'" target="_blank" rel="noopener">Itinéraire</a>'+acts+'</div></li>';
}
function render(){
  var all=visible();
  var near=all.filter(function(x){return !x.st}), visit=all.filter(function(x){return x.st==="visit"}),
      seen=Object.keys(db).filter(function(k){return db[k].s!=="visit"}).length;
  $("cNear").textContent=near.length; $("cVisit").textContent=visit.length; $("cSeen").textContent=seen;
  var list=$("list"), html="";
  if(tab==="near"){
    html=near.length?near.map(cardHtml).join(""):'<li class="empty">'+(pos?"Aucun nouveau prospect dans ce rayon. Tu peux élargir le rayon dans les réglages.":"Appuie sur Démarrer pour afficher les prospects près de toi.")+'</li>';
  }else if(tab==="visit"){
    html=visit.length?visit.map(cardHtml).join(""):'<li class="empty">Rien à visiter pour l\'instant.</li>';
  }else if(tab==="seen"){
    var ids=Object.keys(db).filter(function(k){return db[k].s!=="visit"});
    ids.sort(function(a,b){return (db[b].t||0)-(db[a].t||0)});
    html=ids.length?ids.map(function(id){var r=db[id],c=cache[id];
      if(c&&pos) return cardHtml({p:c,d:dist(pos.lat,pos.lon,c.lat,c.lon),st:r.s});
      return '<li class="card"><div class="dist" style="font-size:18px">—</div><div class="name"><span class="pill '+r.s+'">'+({known:"Connu",no:"Écarté"})[r.s]+'</span> '+esc(r.n)+'</div><div class="meta">'+esc(r.c)+'</div><div class="acts"><button data-a="reset" data-id="'+id+'">Remettre dans la liste</button></div></li>'}).join(""):
      '<li class="empty">Ta base est vide. Chaque prospect que tu marques « Je connais » ou « Pas intéressant » arrive ici et n\'est plus proposé.</li>';
  }
  list.innerHTML=html;
  list.hidden=(tab==="map");
  if(tab==="map") drawMap(all);
  document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",b.id==="tab"+({near:"Near",visit:"Visit",seen:"Seen",map:"Map"})[tab]?"true":"false")});
  $("mapWrap").hidden=(tab!=="map");
}

/* ---------- carte ---------- */
function drawMap(all){
  if(typeof L==="undefined"){$("mapWrap").innerHTML='<div class="empty">La carte n\'a pas pu se charger (connexion).</div>';return}
  if(!map){map=L.map("map");L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);layer=L.layerGroup().addTo(map)}
  layer.clearLayers();
  var pts=[];
  if(pos){L.circleMarker([pos.lat,pos.lon],{radius:9,color:"#fff",weight:3,fillColor:"#1b5fd1",fillOpacity:1}).addTo(layer);pts.push([pos.lat,pos.lon])}
  all.forEach(function(x){
    var col=x.st==="visit"?"#a15c00":x.st?"#6b7480":(x.d<=settings.alert?"#c2410c":"#17794a");
    var f=fmt(x.d);
    L.circleMarker([x.p.lat,x.p.lon],{radius:8,color:"#fff",weight:2,fillColor:col,fillOpacity:1}).addTo(layer)
      .bindPopup("<b>"+esc(x.p.name)+"</b><br>"+f[0]+" "+f[1]+"<br>"+esc(x.p.adr)+", "+esc(x.p.ville));
    pts.push([x.p.lat,x.p.lon]);
  });
  setTimeout(function(){map.invalidateSize();if(pts.length>1)map.fitBounds(pts,{padding:[24,24],maxZoom:16});else if(pts.length)map.setView(pts[0],14)},50);
}

/* ---------- actions ---------- */
function mark(id,a){
  if(a==="reset"){delete db[id]}
  else{var c=cache[id]||{};db[id]={s:a,n:c.name||(db[id]&&db[id].n)||"",c:c.ville||(db[id]&&db[id].c)||"",t:Date.now()}}
  save(KEY_DB,db); render();
}

/* ---------- alertes ---------- */
function beep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type="sine";o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+.18);
  }catch(e){}
}
function speak(t){
  try{
    if(!settings.voice||!window.speechSynthesis) return;
    var u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=1;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
function checkAlerts(){
  if(!pos) return;
  var cand=visible().filter(function(x){return !x.st&&x.d<=settings.alert&&!alerted[x.p.id]});
  if(!cand.length) return;
  var x=cand[0]; alerted[x.p.id]=1; cand.forEach(function(c){alerted[c.p.id]=1});
  var f=fmt(x.d), n=cand.length>1?(" et "+(cand.length-1)+" autre"+(cand.length>2?"s":"")):"";
  var txt="Prospect à "+f[0]+(f[1]==="m"?" mètres":" kilomètres")+" : "+x.p.name+(x.p.ville?", "+x.p.ville:"")+n+".";
  $("alertBox").innerHTML='<div class="alert" role="alert"><span>'+esc(txt)+'</span><button id="alertOk">Vu</button></div>';
  $("alertOk").onclick=function(){$("alertBox").innerHTML=""};
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  beep(); speak(txt);
}

/* ---------- position ---------- */
function onPos(p){
  pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
  var far=!lastFetch||dist(lastFetch.lat,lastFetch.lon,pos.lat,pos.lon)>Math.max(250,settings.radius*250);
  if(far) fetchAround(); else {render();checkAlerts()}
}
function onErr(e){
  var m={1:"Localisation refusée. Autorise-la dans les réglages du navigateur, ou utilise « Tester à Colmar ».",2:"Position introuvable.",3:"Localisation trop lente."}[e.code]||"Erreur de localisation.";
  say(m,true);
}
async function keepAwake(){try{if(navigator.wakeLock){wake=await navigator.wakeLock.request("screen")}}catch(e){}}
function start(){
  beep(); // débloque le son
  if(!navigator.geolocation){say("Ce navigateur ne sait pas se localiser.",true);return}
  testMode=false; if(watchId!=null) navigator.geolocation.clearWatch(watchId);
  say("Localisation en cours…");
  watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  keepAwake(); $("btnStart").textContent="Actualiser maintenant";
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&watchId!=null)keepAwake()});

/* ---------- événements ---------- */
$("btnStart").onclick=function(){ if(watchId!=null&&pos){lastFetch=null;fetchAround()} else start() };
$("btnSettings").onclick=function(){var h=$("settings").hidden;$("settings").hidden=!h;$("btnSettings").setAttribute("aria-expanded",String(h))};
$("settings").addEventListener("change",function(){readSettings();lastFetch=null;alerted={};if(pos)fetchAround()});
$("btnTest").onclick=function(){
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}
  testMode=true;pos={lat:48.0794,lon:7.3585,acc:0};lastFetch=null;$("btnStart").textContent="Actualiser maintenant";fetchAround();
};
$("list").addEventListener("click",function(e){var b=e.target.closest("button[data-a]");if(b)mark(b.getAttribute("data-id"),b.getAttribute("data-a"))});
[["tabNear","near"],["tabVisit","visit"],["tabSeen","seen"],["tabMap","map"]].forEach(function(t){$(t[0]).onclick=function(){tab=t[1];render()}});
$("btnExport").onclick=function(){
  var blob=new Blob([JSON.stringify(db,null,1)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="prospects-connus.json";document.body.appendChild(a);a.click();a.remove();
};
$("btnImport").onclick=function(){$("fileImport").click()};
$("fileImport").onchange=function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);for(var k in o)if(o[k]&&o[k].s)db[k]=o[k];save(KEY_DB,db);render();say("Base importée : "+Object.keys(o).length+" entrées.")}catch(e){say("Fichier illisible.",true)}};
  r.readAsText(f);
};

drawSettings(); render();
})();
